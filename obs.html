    <style>

#app {

        .player-card {

           grid-template-columns:
    82px

        .stats {

        .stat {

        .results {
    height: 44px;

}
        .result {

            color: #ff5264;
        }
.win-count {
    color: #22e879 !important;
}

.loss-count {
    color: #ff5264 !important;
}
        .winrate {
            display: flex;

            flex-direction: column;

            justify-content: center;
        }

        .winrate-label {
            color: #82909e;

            font-size: 5px;
            font-weight: 700;

            text-transform: uppercase;
        }

        .winrate-value {
            margin-top: 2px;

            font-size: 10px;
            font-weight: 900;
        }

        .message {
            width: 390px;

            padding: 8px 10px;

            border: 1px solid #26313a;

            border-radius: 8px;

        @media (max-width: 420px) {
            #app,

<body>

<div id="app"></div>

<script>
    const API_BASE =
        "https://faceit-target-api.szymonkrajewski70.workers.dev";

    const params =
        new URLSearchParams(
            window.location.search
        );

    const ME =
        params.get("me")?.trim() ||
        "-krajewsky-";

    const TARGET =
        params.get("target")?.trim() ||
        (
            ME.toLowerCase() === "-tobol-"
                ? "-krajewsky-"
                : "-TOBOL-"
        );

    const RANK_IMAGES = {
        1: "https://support.faceit.com/hc/article_attachments/10525200575516",
        2: "https://support.faceit.com/hc/article_attachments/10525189649308",
        3: "https://support.faceit.com/hc/article_attachments/10525200576796",
        4: "https://support.faceit.com/hc/article_attachments/10525185037724",
        5: "https://support.faceit.com/hc/article_attachments/10525215800860",
        6: "https://support.faceit.com/hc/article_attachments/10525245409692",
        7: "https://support.faceit.com/hc/article_attachments/10525185034012",
        8: "https://support.faceit.com/hc/article_attachments/10525189648796",
        9: "https://support.faceit.com/hc/article_attachments/10525200576028",
        10: "https://support.faceit.com/hc/article_attachments/10525189646876"
    };

    let lastWebhookTimestamp = null;
    let checkingWebhook = false;

    function $(selector) {
        return document.querySelector(selector);
    }

    function formatNumber(
        value,
        decimals = 0
    ) {
        const number =
            Number(value);

        if (
            !Number.isFinite(number)
        ) {
            return "—";
        }

        return number.toFixed(
            decimals
        );
    }

    function formatSigned(
        value
    ) {
        const number =
            Number(value);

        if (
            !Number.isFinite(number)
        ) {
            return "—";
        }

        if (number > 0) {
            return `+${number}`;
        }

        return String(number);
    }

    function rankImage(level) {
        return (
            RANK_IMAGES[
                Number(level)
            ] || ""
        );
    }

    function getAvatarUrl(
        avatar
    ) {
        if (!avatar) {
            return "";
        }

        return (
            `${API_BASE}/avatar?url=` +
            encodeURIComponent(avatar)
        );
    }

    function getFlagUrl(
        country
    ) {
        if (!country) {
            return "";
        }

        return `
            https://flagcdn.com/w40/${String(
                country
            ).toLowerCase()}.png
        `;
    }

    function escapeHtml(
        value
    ) {
        return String(
            value ?? ""
        )
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    async function getPlayer(
        nickname
    ) {
        const response =
            await fetch(
                `${API_BASE}/?nickname=${encodeURIComponent(
                    nickname
                )}`,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        return await response.json();
    }

    function renderPlayer(
        player,
        role
    ) {
        const recent =
            player.recent || {};

        const lastMatch =
            recent.lastMatch || {};

        const wins =
            Number(recent.wins);

        const losses =
            Number(recent.losses);

        const winrateRecent =
            Number.isFinite(wins) &&
            Number.isFinite(losses) &&
            wins + losses > 0
                ? Math.round(
                    wins /
                    (wins + losses) *
                    100
                )
                : null;

        const lifetimeWinrate =
            Number(player.stats?.wins);

        const winrate =
            Number.isFinite(
                winrateRecent
            )
                ? winrateRecent
                : lifetimeWinrate;

        const elo24 =
            player.elo24h;

        const avatar =
            getAvatarUrl(
                player.avatar
            );

        const flag =
            getFlagUrl(
                player.country
            );

        const level =
            Number(player.level);

        const kills =
            lastMatch.kills ??
            recent.kills;

        const kd =
            lastMatch.kd ??
            recent.kd;

        const hs =
            lastMatch.headshots ??
            recent.headshots;

       const firstResult =
    recent.form?.[0];

const secondResult =
    recent.form?.[1];

function normalizeResult(result) {
    if (
        result === "W" ||
        result === "w" ||
        Number(result) > 0
    ) {
        return "W";
    }

    if (
        result === "L" ||
        result === "l" ||
        Number(result) === 0 ||
        Number(result) < 0
    ) {
        return "L";
    }

    return "—";
}

const resultOne =
    normalizeResult(firstResult);

const resultTwo =
    normalizeResult(secondResult);

        return `
            <div class="player-card">

                <div class="identity">

                    <div class="rank">
                        ${
                            rankImage(level)
                                ? `
                                    <img
                                        src="${rankImage(level)}"
                                        alt="FACEIT Level ${level}"
                                    >
                                  `
                                : ""
                        }
                    </div>

                    <div class="avatar-wrap">

                        <img
                            class="avatar"
                            src="${avatar}"
                            alt="${escapeHtml(
                                player.nickname
                            )}"
                        >

                        <span class="online"></span>

                        ${
                            flag
                                ? `
                                    <img
                                        class="flag"
                                        src="${flag}"
                                        alt="${String(
                                            player.country || ""
                                        ).toUpperCase()}"
                                    >
                                  `
                                : ""
                        }

                    </div>

                </div>

                <div class="player-info">

                    <div class="role">
                        ${escapeHtml(role)}
                    </div>

                    <div class="nickname">
                        ${escapeHtml(
                            player.nickname
                        )}
                    </div>

                    <div class="elo-line">

                        <span class="elo">
                            ${formatNumber(
                                player.elo
                            )}
                        </span>

                        <span class="elo-label">
                            ELO
                        </span>

                        <span class="elo24">
                            ${
                                elo24 === null ||
                                elo24 === undefined
                                    ? "—"
                                    : `(${formatSigned(
                                        elo24
                                    )})`
                            }
                        </span>

                    </div>

                </div>

                <div class="stats">

                    <div class="stat">
                        <div class="stat-label">
                            Zabójstwa
                        </div>

                        <div class="stat-value">
                            ${formatNumber(
                                kills
                            )}
                        </div>
                    </div>

                    <div class="stat">
                        <div class="stat-label">
                            K/D
                        </div>

                        <div class="stat-value">
                            ${formatNumber(
                                kd,
                                2
                            )}
                        </div>
                    </div>

                    <div class="stat">
                        <div class="stat-label">
                            HS %
                        </div>

                        <div class="stat-value">
                            ${
                                Number.isFinite(
                                    Number(hs)
                                )
                                    ? `${formatNumber(
                                        hs,
                                        0
                                    )}%`
                                    : "—"
                            }
                        </div>
                    </div>

                </div>

                                <div class="results">

                    <div class="result win-count">
                        ${formatNumber(recent.wins)}
                    </div>

                    <div class="result loss-count">
                        ${formatNumber(recent.losses)}
                    </div>

                    <div class="winrate">

                        <div class="winrate-label">
                            WIN RATE
                        </div>

                        <div class="winrate-value">
                            ${
                                Number.isFinite(winrate)
                                    ? `${formatNumber(winrate, 0)}%`
                                    : "—"
                            }
                        </div>

                    </div>

                </div>

            </div>
        `;
    }

    async function loadWidget() {
        const app =
            $("#app");

        try {
            const [
                me,
                target
            ] = await Promise.all([
                getPlayer(ME),
                getPlayer(TARGET)
            ]);

           app.innerHTML =
    renderPlayer(
        me,
        "YOUR PROFILE"
    ) +
    renderPlayer(
        target,
        "TARGET"
    );

        } catch (error) {
            console.error(
                "OBS widget error:",
                error
            );

            app.innerHTML = `
                <div class="message">
                    Nie udało się pobrać danych FACEIT.
                </div>
            `;
        }
    }

    async function checkWebhook() {
        if (checkingWebhook) {
            return;
        }

        checkingWebhook = true;

        try {
            const response =
                await fetch(
                    `${API_BASE}/status`,
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {
                return;
            }

            const status =
                await response.json();

            const updatedAt =
                Number(
                    status?.updatedAt
                );

            if (
                !Number.isFinite(
                    updatedAt
                )
            ) {
                return;
            }

            if (
                lastWebhookTimestamp === null
            ) {
                lastWebhookTimestamp =
                    updatedAt;

                return;
            }

            if (
                updatedAt >
                lastWebhookTimestamp
            ) {
                lastWebhookTimestamp =
                    updatedAt;

                await loadWidget();
            }

        } catch (error) {
            console.error(
                "Webhook watcher:",
                error
            );
        } finally {
            checkingWebhook =
                false;
        }
    }

    loadWidget();

    setInterval(
        checkWebhook,
        10000
    );

    setInterval(
        loadWidget,
        10 * 60 * 1000
    );
</script>

</body>
