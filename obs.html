<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FACEIT OBS Widget</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-width: 0;
            margin: 0;
            padding: 0;

            background: transparent;

            overflow: visible;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

            text-rendering: geometricPrecision;
        }

        body {
            color: #ffffff;

            font-family:
                Inter,
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;
        }

        #app {
            width: 900px;

            display: flex;
            flex-direction: column;

            gap: 8px;

            overflow: visible;
        }

        /* =========================================================
           PLAYER CARD
        ========================================================= */

        .player-card {
            position: relative;

            width: 900px;
            height: 108px;

            display: grid;

            grid-template-columns:
                150px
                300px
                210px
                240px;

            align-items: center;

            padding: 10px 14px;

            border:
                1px solid
                #263541;

            border-left:
                5px solid
                #ff5500;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #11191f 0%,
                    #0d1318 100%
                );

            box-shadow:
                0 7px 22px
                rgba(
                    0,
                    0,
                    0,
                    0.30
                );

            overflow: hidden;
        }

        /* =========================================================
           LEVEL + AVATAR
        ========================================================= */

        .identity {
            width: 150px;
            height: 88px;

            display: flex;
            align-items: center;

            padding: 0;
        }

        .rank {
            width: 60px;
            height: 60px;

            flex: 0 0 60px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rank img {
            display: block;

            width: 60px;
            height: 60px;

            object-fit: contain;
        }

        .avatar-wrap {
            position: relative;

            width: 76px;
            height: 76px;

            flex: 0 0 76px;

            margin-left: 6px;
        }

        .avatar {
            display: block;

            width: 76px;
            height: 76px;

            object-fit: cover;

            border-radius: 50%;

            border:
                2px solid
                #334453;
        }

        .online {
            position: absolute;

            right: 1px;
            bottom: 4px;

            width: 14px;
            height: 14px;

            border-radius: 50%;

            background: #21e874;

            border:
                3px solid
                #11191f;
        }

        .flag {
            position: absolute;

            left: 49px;
            bottom: -3px;

            width: 30px;
            height: 19px;

            object-fit: cover;

            border-radius: 3px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );
        }

        /* =========================================================
           NICK + ELO
        ========================================================= */

        .player-info {
            width: 300px;
            min-width: 0;

            padding: 0 18px;

            margin: 0;
        }

        .role {
            margin-bottom: 4px;

            color: #83a1b8;

            font-size: 10px;
            font-weight: 800;

            line-height: 1;

            letter-spacing: 0.14em;

            text-transform: uppercase;
        }

        .nickname {
            max-width: 260px;

            color: #ffffff;

            font-size: 28px;
            font-weight: 900;

            line-height: 1;

            white-space: nowrap;

            overflow: hidden;
            text-overflow: ellipsis;
        }

        .elo-line {
            display: flex;

            align-items: baseline;

            gap: 7px;

            margin-top: 7px;
        }

        .elo {
            color: #ffffff;

            font-size: 24px;
            font-weight: 900;

            line-height: 1;
        }

        .elo-label {
            color: #81909c;

            font-size: 10px;
            font-weight: 800;
        }

        .elo24 {
            color: #aebbc5;

            font-size: 15px;
            font-weight: 800;
        }

        .elo24.positive {
            color: #20e978;
        }

        .elo24.negative {
            color: #ff5668;
        }

        /* =========================================================
           MAIN STATS
        ========================================================= */

        .stats {
            width: 210px;
            height: 72px;

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            align-items: stretch;

            padding: 0 16px;

            border-left:
                1px solid
                #2b3843;
        }

        .stat {
            min-width: 0;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 0 4px;
        }

        .stat-label {
            color: #83919d;

            font-size: 9px;
            font-weight: 800;

            line-height: 1;

            letter-spacing: 0.06em;

            text-transform: uppercase;

            white-space: nowrap;
        }

        .stat-value {
            margin-top: 8px;

            color: #ffffff;

            font-size: 24px;
            font-weight: 900;

            line-height: 1;
        }

        /* =========================================================
           WINS / LOSSES / WIN RATE
        ========================================================= */

        .results {
            width: 240px;
            height: 72px;

            display: grid;

            grid-template-columns:
                58px
                58px
                1fr;

            align-items: center;

            gap: 10px;

            padding-left: 16px;

            border-left:
                1px solid
                #2b3843;
        }

        .result {
            width: 58px;
            height: 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background:
                rgba(
                    17,
                    27,
                    33,
                    0.90
                );

            font-size: 23px;
            font-weight: 900;

            line-height: 1;
        }

        .win-count {
            color: #20e978;

            border:
                2px solid
                rgba(
                    32,
                    233,
                    120,
                    0.48
                );
        }

        .loss-count {
            color: #ff5568;

            border:
                2px solid
                rgba(
                    255,
                    85,
                    104,
                    0.42
                );
        }

        .winrate {
            width: 86px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;
        }

        .winrate-label {
            color: #83919d;

            font-size: 8px;
            font-weight: 800;

            line-height: 1;

            letter-spacing: 0.06em;

            text-transform: uppercase;

            white-space: nowrap;
        }

        .winrate-value {
            margin-top: 7px;

            color: #ffffff;

            font-size: 22px;
            font-weight: 900;

            line-height: 1;
        }

        /* =========================================================
           QUALITY / RESPONSIVE
        ========================================================= */

        img {
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>

<body>

<div id="app"></div>

<script>
    const API_BASE =
        "https://faceit-target-api.szymonkrajewski70.workers.dev";

    const params =
        new URLSearchParams(
            window.location.search
        );

    const ME =
        params.get("me")?.trim() ||
        "-krajewsky-";

    const TARGET =
        params.get("target")?.trim() ||
        (
            ME.toLowerCase() ===
            "-tobol-".toLowerCase()
        )
            ? "-krajewsky-"
            : "-TOBOL-";

    const RANK_IMAGES = {
        1: "https://support.faceit.com/hc/article_attachments/10525200575516",
        2: "https://support.faceit.com/hc/article_attachments/10525189649308",
        3: "https://support.faceit.com/hc/article_attachments/10525200576796",
        4: "https://support.faceit.com/hc/article_attachments/10525185037724",
        5: "https://support.faceit.com/hc/article_attachments/10525215800860",
        6: "https://support.faceit.com/hc/article_attachments/10525245409692",
        7: "https://support.faceit.com/hc/article_attachments/10525185034012",
        8: "https://support.faceit.com/hc/article_attachments/10525189648796",
        9: "https://support.faceit.com/hc/article_attachments/10525200576028",
        10: "https://support.faceit.com/hc/article_attachments/10525189646876"
    };

    function formatNumber(
        value,
        decimals = 0
    ) {
        const number =
            Number(value);

        if (
            !Number.isFinite(number)
        ) {
            return "—";
        }

        return number.toFixed(
            decimals
        );
    }

    function formatSigned(
        value
    ) {
        const number =
            Number(value);

        if (
            !Number.isFinite(number)
        ) {
            return "—";
        }

        if (number > 0) {
            return `+${number}`;
        }

        return String(number);
    }

    function rankImage(
        level
    ) {
        return (
            RANK_IMAGES[
                Number(level)
            ] || ""
        );
    }

    function getAvatarUrl(
        avatar
    ) {
        if (!avatar) {
            return "";
        }

        return (
            `${API_BASE}/avatar?url=` +
            encodeURIComponent(
                avatar
            )
        );
    }

    function getFlagUrl(
        country
    ) {
        if (!country) {
            return "";
        }

        return (
            "https://flagcdn.com/w80/" +
            String(country).toLowerCase() +
            ".png"
        );
    }

    function escapeHtml(
        value
    ) {
        return String(
            value ?? ""
        )
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );
    }

    async function getPlayer(
        nickname
    ) {
        const response =
            await fetch(
                `${API_BASE}/?nickname=${encodeURIComponent(
                    nickname
                )}`,
                {
                    cache:
                        "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        return await response.json();
    }

    function renderPlayer(
        player,
        role
    ) {
        const recent =
            player.recent || {};

        const today =
            player.today || {
                wins: 0,
                losses: 0,
                kills: null,
                deaths: null,
                kd: null
            };

        const lastMatch =
            recent.lastMatch || {};

        const todayWins =
            Number(today.wins) || 0;

        const todayLosses =
            Number(today.losses) || 0;

        const todayMatches =
            todayWins +
            todayLosses;

        const winrate =
            todayMatches > 0
                ? Math.round(
                    (
                        todayWins /
                        todayMatches
                    ) * 100
                )
                : 0;

        const todayKd =
            Number.isFinite(
                Number(today.kd)
            )
                ? Number(today.kd)
                : null;

        const kills =
            Number.isFinite(
                Number(
                    lastMatch.kills
                )
            )
                ? Number(
                    lastMatch.kills
                )
                : null;

        const level =
            Number(player.level);

        const avatar =
            getAvatarUrl(
                player.avatar
            );

        const flag =
            getFlagUrl(
                player.country
            );

        const elo24 =
            player.elo24h;

        let elo24Class =
            "";

        if (
            Number(elo24) > 0
        ) {
            elo24Class =
                "positive";
        } else if (
            Number(elo24) < 0
        ) {
            elo24Class =
                "negative";
        }

        return `
            <div class="player-card">

                <div class="identity">

                    <div class="rank">
                        ${
                            rankImage(level)
                                ? `
                                    <img
                                        src="${rankImage(level)}"
                                        alt="FACEIT Level ${level}"
                                    >
                                  `
                                : ""
                        }
                    </div>

                    <div class="avatar-wrap">

                        <img
                            class="avatar"
                            src="${avatar}"
                            alt="${escapeHtml(
                                player.nickname
                            )}"
                        >

                        <span
                            class="online"
                        ></span>

                        ${
                            flag
                                ? `
                                    <img
                                        class="flag"
                                        src="${flag}"
                                        alt=""
                                    >
                                  `
                                : ""
                        }

                    </div>

                </div>

                <div class="player-info">

                    <div class="role">
                        ${escapeHtml(role)}
                    </div>

                    <div class="nickname">
                        ${escapeHtml(
                            player.nickname
                        )}
                    </div>

                    <div class="elo-line">

                        <span class="elo">
                            ${formatNumber(
                                player.elo
                            )}
                        </span>

                        <span class="elo-label">
                            ELO
                        </span>

                        <span
                            class="elo24 ${
                                elo24Class
                            }"
                        >
                            ${
                                elo24 === null ||
                                elo24 === undefined
                                    ? "—"
                                    : `(${formatSigned(
                                        elo24
                                    )})`
                            }
                        </span>

                    </div>

                </div>

                <div class="stats">

                    <div class="stat">

                        <div class="stat-label">
                            ZABÓJSTWA
                        </div>

                        <div class="stat-value">
                            ${
                                kills === null
                                    ? "—"
                                    : formatNumber(
                                        kills
                                    )
                            }
                        </div>

                    </div>

                    <div class="stat">

                        <div class="stat-label">
                            K/D
                        </div>

                        <div class="stat-value">
                            ${
                                todayKd === null
                                    ? "—"
                                    : formatNumber(
                                        todayKd,
                                        2
                                    )
                            }
                        </div>

                    </div>

                </div>

                <div class="results">

                    <div
                        class="result win-count"
                    >
                        ${formatNumber(
                            todayWins
                        )}
                    </div>

                    <div
                        class="result loss-count"
                    >
                        ${formatNumber(
                            todayLosses
                        )}
                    </div>

                    <div class="winrate">

                        <div
                            class="winrate-label"
                        >
                            WIN RATE
                        </div>

                        <div
                            class="winrate-value"
                        >
                            ${formatNumber(
                                winrate,
                                0
                            )}%
                        </div>

                    </div>

                </div>

            </div>
        `;
    }

    async function loadWidget() {
        const app =
            document.getElementById(
                "app"
            );

        try {
            const [
                me,
                target
            ] = await Promise.all([
                getPlayer(ME),
                getPlayer(TARGET)
            ]);

            app.innerHTML =
                renderPlayer(
                    me,
                    "YOUR PROFILE"
                ) +
                renderPlayer(
                    target,
                    "TARGET"
                );

        } catch (error) {
            console.error(
                "OBS widget error:",
                error
            );

            app.innerHTML = `
                <div
                    style="
                        width:900px;
                        padding:20px;
                        color:#fff;
                        background:#11191f;
                        border-radius:12px;
                        font-size:16px;
                        font-weight:800;
                    "
                >
                    Nie udało się pobrać danych FACEIT.
                </div>
            `;
        }
    }

    let lastWebhookTimestamp =
        null;

    let checkingWebhook =
        false;

    async function checkWebhook() {
        if (
            checkingWebhook
        ) {
            return;
        }

        checkingWebhook =
            true;

        try {
            const response =
                await fetch(
                    `${API_BASE}/status`,
                    {
                        cache:
                            "no-store"
                    }
                );

            if (!response.ok) {
                return;
            }

            const status =
                await response.json();

            const updatedAt =
                Number(
                    status?.updatedAt
                );

            if (
                !Number.isFinite(
                    updatedAt
                )
            ) {
                return;
            }

            if (
                lastWebhookTimestamp ===
                null
            ) {
                lastWebhookTimestamp =
                    updatedAt;

                return;
            }

            if (
                updatedAt >
                lastWebhookTimestamp
            ) {
                lastWebhookTimestamp =
                    updatedAt;

                await loadWidget();
            }

        } catch (error) {
            console.error(
                "Webhook watcher:",
                error
            );
        } finally {
            checkingWebhook =
                false;
        }
    }

    loadWidget();

    setInterval(
        checkWebhook,
        10000
    );

    setInterval(
        loadWidget,
        10 * 60 * 1000
    );
</script>

</body>
</html>
