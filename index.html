<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FACEIT Target Widget</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <div class="logo">
            <span class="orange-dot"></span>
            FACEIT TARGET
        </div>

        <div class="status">
            ● LIVE TRACKING
        </div>

    </div>


    <!-- TARGET SEARCH -->
    <div class="target-search">

        <input
            id="targetInput"
            type="text"
            placeholder="Wpisz nick gracza FACEIT..."
            autocomplete="off"
        >

        <button id="searchButton">
            SEARCH
        </button>

    </div>


    <!-- PLAYERS -->
    <div class="players">

        <!-- MY PROFILE -->
        <div class="player-card">

            <div class="avatar">
                <img
                    id="myAvatar"
                    src=""
                    alt="Avatar"
                >
            </div>

            <div class="player-info">

                <div class="small-title">
                    YOUR PROFILE
                </div>

                <div class="nickname" id="myNickname">
                    -krajewsky-
                </div>

                <div class="country" id="myCountry">
                    🇵🇱 Poland
                </div>

            </div>

            <div class="level">

                <span>LVL</span>

                <strong id="myLevel">
                    -
                </strong>

            </div>

        </div>


        <!-- VS -->
        <div class="vs">
            VS
        </div>


        <!-- TARGET -->
        <div class="player-card target">

            <div class="avatar target-avatar">
                <img
                    id="targetAvatar"
                    src=""
                    alt="Avatar"
                >
            </div>

            <div class="player-info">

                <div class="small-title">
                    TARGET
                </div>

                <div class="nickname" id="targetNickname">
                    -TOBOL-
                </div>

                <div class="country" id="targetCountry">
                    🇵🇱 Poland
                </div>

            </div>

            <div class="level">

                <span>LVL</span>

                <strong id="targetLevel">
                    -
                </strong>

            </div>

        </div>

    </div>


    <!-- ELO -->
    <div class="elo-section">

        <div class="elo-box">

            <span>ELO</span>

            <strong id="myElo">
                -
            </strong>

        </div>


        <div class="progress-area">

            <div class="progress-text">

                <span>
                    Distance to target
                </span>

                <strong id="difference">
                    -
                </strong>

            </div>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-fill">
                </div>

            </div>

        </div>


        <div class="elo-box target-elo">

            <span>
                TARGET ELO
            </span>

            <strong id="targetElo">
                -
            </strong>

        </div>

    </div>


    <!-- STATS -->
    <div class="stats">

        <div class="stat">

            <span>
                WINS
            </span>

            <strong id="wins">
                -
            </strong>

        </div>


        <div class="stat">

            <span>
                MATCHES
            </span>

            <strong id="matches">
                -
            </strong>

        </div>


        <div class="stat">

            <span>
                K/D
            </span>

            <strong id="kd">
                -
            </strong>

        </div>


        <div class="stat">

            <span>
                RECENT FORM
            </span>

            <strong id="form">
                -
            </strong>

        </div>

    </div>


    <!-- FOOTER -->
    <div class="footer">

        <span>
            FACEIT TARGET WIDGET
        </span>

        <span id="footerPlayers">
            -krajewsky- vs -TOBOL-
        </span>

    </div>

</div>


<script src="script.js?v=2"></script>    

</body>
</html>
